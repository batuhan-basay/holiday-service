services:
  holiday-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: holiday-service-api:local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HolidayData__CacheDuration: "12:00:00"
      HolidayData__HijriDayAdjustment: "0"
      RateLimiting__PermitLimit: "100"
      RateLimiting__WindowSeconds: "60"
      ApiKeys__Enabled: "true"
      ApiKeys__Clients__0__Owner: docker-compose
      ApiKeys__Clients__0__Key: ${HOLIDAY_API_KEY:-change-me-before-deploying}
    restart: unless-stopped
